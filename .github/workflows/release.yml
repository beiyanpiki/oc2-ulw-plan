name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - name: Check tag matches package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "v$VERSION" = "$TAG" || {
            echo "tag $TAG does not match package version v$VERSION" >&2
            exit 1
          }

      - name: Pack the release tarball
        run: npm pack

      - name: Compose release notes
        run: |
          PREV="$(git tag --sort=-v:refname | grep -Fvx "$TAG" | head -1 || true)"
          {
            echo "# oc2-ulw-plan $TAG"
            echo
            echo "OpenCode V2 Plan → Spec → Execute plugin."
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/beiyanpiki/oc2-ulw-plan/main/scripts/install-release.sh | bash"
            echo '```'
            echo
            echo "npm:"
            echo
            echo '```bash'
            echo "npm install -g oc2-ulw-plan"
            echo "oc2-ulw-plan init --global --plugin oc2-ulw-plan"
            echo '```'
            echo
            echo "## Changes"
            echo
            if [ -n "$PREV" ]; then
              git log --oneline "$PREV..$TAG" | sed 's/^/- /'
            else
              git log --oneline -20 "$TAG" | sed 's/^/- /'
            fi
          } > /tmp/notes.md
          cat /tmp/notes.md

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TARBALL="oc2-ulw-plan-$VERSION.tgz"
          test -f "$TARBALL"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TARBALL" scripts/install-release.sh --clobber
          else
            gh release create "$TAG" "$TARBALL" scripts/install-release.sh \
              --title "oc2-ulw-plan $TAG" \
              --notes-file /tmp/notes.md
          fi

      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npm publish "./oc2-ulw-plan-$VERSION.tgz" --access public --provenance
